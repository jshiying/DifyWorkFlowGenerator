app:
  description: 这是用于生成Dify工作流的提示词。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: chat
  name: Dify工作流生成提示词
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 5
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    reranking_enable: true
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    allowed_file_types:
    - image
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: gpt-5.4
    provider: openai
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: "prompt:\n  metadata:\n    title: Dify工作流生成提示词\n    version: 1.0.0\n\
    \    description: 用于生成Dify工作流文件的提示词定义\n\n\n  input_requirements: |\n\
    \    请提供以下信息：\n    1. 工作流的目的（例：书籍摘要生成、商品描述创作等）\n    2. 作为输入所需的信息（例：书名、商品名称与特征等）\n\
    \    3. 作为输出所期望的格式和内容\n    4. 特殊约束条件（字数限制、语气指定等）\n\n\n  instructions:\n\
    \    workflow_overview: |\n      根据所提供的需求，生成包含以下要素的Dify工作流文件（YAML格式）：\n\
    \      - 由3个节点（开始、LLM、结束）构成的简单工作流\n      - 节点间按顺序执行连接\n      - 自动化从输入到输出的一系列处理\n\
    \n\n    required_structure:\n      app_info:\n        - mode: 指定为workflow\n  \
    \      - name: 设置体现目的的名称\n        - version: 使用0.1.3\n\n\n      workflow_graph:\n\
    \        edges:\n          - source: 开始节点的ID（例：'1731228343114'）\n           \
    \ target: LLM节点的ID（例：'1731229438627'）\n            data:\n              sourceType:\
    \ start\n              targetType: llm\n          - source: LLM节点的ID（例：'1731229438627'）\n\
    \            target: 结束节点的ID（例：'1731228345560'）\n            data:\n        \
    \      sourceType: llm\n              targetType: end\n          - source: 问题分类器节点的ID\n\
    \            sourceHandle: '1'  # 用于问题分类1\n            target: 目标节点ID1\n  \
    \          targetHandle: target\n            data:\n              sourceType:\
    \ question-classifier\n              targetType: [目标节点类型]\n          - source:\
    \ 问题分类器节点的ID\n            sourceHandle: '2'  # 用于问题分类2\n            target: 目标节点ID2\n\
    \            targetHandle: target\n            data:\n              sourceType:\
    \ question-classifier\n              targetType: [目标节点类型]\n          - source:\
    \ [IF/ELSE节点ID]\n            target: [目标节点ID]\n            data:\n      \
    \        sourceType: if-else\n              targetType: [目标节点类型]\n      \
    \      sourceHandle: 'true'  # IF条件成立时\n          - source: [IF/ELSE节点ID]\n \
    \           target: [另一个目标节点ID]\n            data:\n              sourceType:\
    \ if-else\n              targetType: [目标节点类型]\n            sourceHandle:\
    \ 'false'  # ELSE条件时\n\n\n        nodes:\n          start_node:\n            -\
    \ id: 唯一ID\n            - type: start\n            - variables:\n         \
    \     # 文件输入的示例\n              - type: file\n                variable: input_document\n\
    \                label: 文档\n                required: true\n             \
    \   max_length: 48\n                allowed_file_types:\n                  - document\n\
    \                allowed_file_upload_methods:\n                  - local_file\n\
    \                  - remote_url\n\n\n              # 数值输入的示例\n              - type:\
    \ number\n                variable: input_number\n                label: 数值\n\
    \                required: true\n                min: 0\n                max:\
    \ 1000000\n\n\n              # 段落输入的示例\n              - type: paragraph\n     \
    \           variable: danraku\n                label: 段落\n                required:\
    \ true\n                max_length: 48\n                options: []\n\n\n    \
    \          # 短文输入的示例\n              - type: text-input\n                variable:\
    \ tanbun\n                label: 短文\n                required: true\n        \
    \        max_length: 48\n                options: []\n\n\n          llm_node:\n\
    \            - id: 唯一ID\n            - type: llm\n            - model:\n  \
    \            - provider: openai\n              - name: gpt-5.4\n              -\
    \ mode: chat\n              - completion_params:\n                - temperature:\
    \ 生成时的温度设置\n            - prompt_template:\n              - id: 唯一ID（例'prompt1'）\n\
    \                role: system\n                text: 用单引号括住的提示词文本\n    \
    \        - context:\n              - enabled: true\n              - variable_selector:\
    \ 指定要使用的变量\n            - vision:\n              - enabled: false\n\n\n     \
    \     end_node:\n            - id: 唯一ID\n            - type: end\n        \
    \    - outputs: #输出变量的定义\n              - input_data: 输入数据\n              - generated_text:\
    \ 生成的文本\n\n\n          http_request_node:\n            - id: 唯一ID\n   \
    \         - type: http-request\n            - data:\n              - authorization:\n\
    \                  config: null\n                  type: no-auth/basic/bearer\
    \  # 指定认证类型\n              - body:\n                  type: json/form-data/x-www-form-urlencoded\n\
    \                  data:  # JSON格式的示例\n                    - id: [键值ID]\n\
    \                      key: [键名]\n                      type: text\n        \
    \              value: [JSON格式的值]\n              - headers: Content-Type:[content-type]\
    \  # 例：application/json\n              - method: get/post/put/delete\n       \
    \       - url: [API端点URL]\n              - timeout:\n                  max_connect_timeout:\
    \ [连接超时秒数]\n                  max_read_timeout: [读取超时秒数]\n         \
    \         max_write_timeout: [写入超时秒数]\n              - title: HTTP请求\n\
    \              - variables: []  # 根据需要定义变量\n\n\n          json_parse_node:\n\
    \            - id: 唯一ID\n            - type: tool\n            - data:\n  \
    \            - provider_id: json_process\n              - provider_name: json_process\n\
    \              - provider_type: builtin\n              - title: JSON Parse\n \
    \             - tool_configurations:\n                  ensure_ascii: 1\n    \
    \          - tool_name: parse\n              - tool_parameters:\n            \
    \      content:\n                    type: mixed\n                    value: '{{#[输入节点ID].[变量名]#}}'\n\
    \                  json_filter:\n                    type: mixed\n           \
    \         value: [要提取的JSON键]\n\n\n          question_classifier_node:\n    \
    \        - id: 唯一ID\n            - type: question-classifier\n            -\
    \ data:\n              - title: 问题分类器\n              - model:\n              \
    \    provider: openai\n                  name: gpt-5.4\n                  mode:\
    \ chat\n                  completion_params:\n                    temperature:\
    \ 0.7\n              - query_variable_selector:\n                  - [输入节点ID]\n\
    \                  - [变量名]\n              - classes:\n                  - id:\
    \ [类别ID]\n                    name: [分类名]\n\n\n          knowledge_retrieval_node:\n\
    \            - id: 唯一ID\n            - type: knowledge-retrieval\n        \
    \    - data:\n              - title: 知识获取\n              - dataset_ids:\n    \
    \              - [数据集ID]\n              - retrieval_mode: multiple\n      \
    \        - multiple_retrieval_config:\n                  reranking_enable: true\n\
    \                  reranking_mode: weighted_score\n                  top_k: 4\n\
    \                  weights:\n                    vector_setting:\n           \
    \           embedding_model_name: text-embedding-3-large\n                   \
    \   embedding_provider_name: openai\n                      vector_weight: 1\n\
    \                    keyword_setting:\n                      keyword_weight: 0\n\
    \              - query_variable_selector:\n                  - [输入节点ID]\n   \
    \               - [变量名]\n\n\n          code_node:\n            - id: 唯一ID\n\
    \            - type: code\n            - data:\n              - code_language:\
    \ python3\n              - code: \"def main(arg1: str) -> dict:\\nreturn {\\n\\\
    \"task_url\\\": \\\"http://example.com/task/\\\"+arg1,\\n}\" # 编写Python代码并用双引号括住。\n\
    \              - title: Python代码执行\n              - variables: []  # 根据需要定义变量\n\
    \              - outputs:  # 输出变量的定义（必填）\n                task_url:  # 变量名\n \
    \                 children: null\n                  type: string  # 变量的类型\n   \
    \           - variables:  # 输入变量的定义（必填）\n                - value_selector:  #\
    \ 来自其他节点的输入\n                  - [输入节点ID]\n                  - [变量名]\n     \
    \             variable: arg1  # 函数的参数名\n\n\n          if_else_node:\n        \
    \    - id: 唯一ID\n            - type: if-else\n            - data:\n       \
    \         title: 条件分支\n                cases:\n                  - case_id: 'true'\n\
    \                    logical_operator: and\n                    conditions:\n\
    \                      - id: 5d3c1fa4-e26c-4f4b-a3a9-d4c32d63d5f8\n          \
    \              varType: number\n                        variable_selector:\n \
    \                         - [输入节点ID]\n                          - [变量名]\n   \
    \                     comparison_operator: 'contains'  # 遵循ComparisonOperator枚举类型\n\
    \                        value: '5'\n                        numberVarType: constant\n\
    \                      - id: f764d294-6b89-46a2-9486-8b2c067e58ff\n          \
    \              varType: string\n                        variable_selector:\n \
    \                         - [输入节点ID]\n                          - [变量名]\n   \
    \                     key: 'subKey'\n                        comparison_operator:\
    \ 'contains'\n                        value: '测试'\n                        sub_variable_condition:\n\
    \                          case_id: 'sub1'\n                          logical_operator:\
    \ and\n                          conditions:\n                            - id:\
    \ 'sub-condition-1'\n                              varType: string\n         \
    \                     comparison_operator: 'start with'\n                    \
    \          value: 'prefix'\n\n\n          variable_aggregator_node:\n        \
    \    - id: 唯一ID\n            - type: variable-aggregator\n            - data:\n\
    \              - title: 变量聚合器\n              - output_type: string/number/boolean\
    \  # 输出变量的类型\n              - variables:                         # 要聚合的变量列表\n\
    \                - - [输入节点ID1]\n                  - [变量名1]\n                -\
    \ - [输入节点ID2]\n                  - [变量名2]\n\n\n          document_extractor_node:\n\
    \            - id: 唯一ID\n            - type: document-extractor\n         \
    \   - data:\n              - title: 文本提取工具\n              - is_array_file:\
    \ false\n              - variable_selector:\n                - [输入节点ID]\n   \
    \             - [变量名]\n\n\n          template_transform_node:\n            - id:\
    \ 唯一ID\n            - type: template-transform\n            - data:\n     \
    \           title: 模板转换\n                template: 模板字符串（Jinja2格式）\n \
    \               variables:\n                  - value_selector:  # 指定输入变量\n \
    \                   - [输入节点ID]\n                    - [变量名]\n               \
    \     variable: [在模板中使用的变量名]\n                outputs:\n                \
    \  output:  # 固定的输出变量名\n                    type: string  # 始终为string类型\n\n\n  \
    \        answer_node:\n            - id: 唯一ID\n            - type: answer\n\
    \            - data:\n                title: 响应节点\n                answer: 响应文本或变量引用\n\
    \                variables: []  # 根据需要定义变量\n\n\n          parameter_extractor_node:\n\
    \            - id: 唯一ID（必填）\n            - type: parameter-extractor（固定）\n\
    \            - data:\n              - title: 参数提取\n              - query: #\
    \ 指定输入变量（必填）\n                - [输入节点ID]\n                - [变量名]\n        \
    \      - model: # 模型设置（必填）\n                - provider: 提供商名称\n           \
    \     - name: 模型名称\n                - mode: chat/completion\n                -\
    \ completion_params:\n                  - temperature: 0.0-1.0\n             \
    \ - reasoning_mode: # 推理模式（必填）\n                - prompt: 基于提示词\n        \
    \        - function_call: 函数调用\n              - parameters: # 提取参数定义（必填）\n\
    \                - name: 参数名\n                  type: 参数类型\n            \
    \      description: 说明文\n                  required: true/false\n            \
    \      options: # select类型的选项\n                    - 选项1\n             \
    \       - 选项2\n              - instruction: 提示词字符串\n              - memory:\
    \ # 内存设置（可选）\n                - role_prefix:\n                  - user: 用户前缀\n\
    \                  - assistant: 助手前缀\n              - vision: # 图像处理设置（可选）\n\
    \                - enabled: true/false\n                - configs: 图像设置\n\n\n\
    \          youtube_transcript_node:\n            - id: 唯一ID\n            -\
    \ data:\n                type: tool\n                title: Free YouTube Transcript\
    \ API\n                provider_name: transcript\n                provider_id:\
    \ transcript\n                provider_type: builtin\n                tool_label:\
    \ Free YouTube Transcript API\n                tool_name: free_youtube_transcript\n\
    \                tool_configurations:\n                  cookies: null\n     \
    \             format: text\n                  language: ja\n                 \
    \ preserve_formatting: 0\n                  proxy: null\n                tool_parameters:\n\
    \                  video_id:\n                    type: mixed\n              \
    \      value: YouTube视频ID或变量引用\n                outputs:\n               \
    \   text:  # 字幕文本的输出变量\n                    type: string\n\n\n          jina_reader_node:\n\
    \            - id: 唯一ID\n            - type: tool\n            - data:\n  \
    \            - provider_id: jina\n              - provider_name: jina\n      \
    \        - provider_type: builtin\n              - title: JinaReader\n       \
    \       - tool_configurations:\n                  gather_all_images_at_the_end:\
    \ 0  # 图像收集设置\n                  gather_all_links_at_the_end: 0   # 链接收集设置\n\
    \                  image_caption: 0                 # 图像说明设置\n           \
    \       no_cache: 0                      # 禁用缓存\n                  proxy_server:\
    \ null               # 代理服务器设置\n                  summary: 0              \
    \         # 摘要功能\n                  target_selector: null            # 目标元素选择器\n\
    \                  wait_for_selector: null          # 等待元素选择器\n            \
    \  - tool_label: JinaReader\n              - tool_name: jina_reader\n        \
    \      - tool_parameters:\n                  url:\n                    type: mixed\n\
    \                    value: '{{#[输入节点ID].[变量名]#}}'  # URL输入\n\n\n          tavily_search_node:\n\
    \            - id: 唯一ID\n            - type: tool\n            - data:\n  \
    \            - provider_id: tavily\n              - provider_name: tavily\n  \
    \            - provider_type: builtin\n              - title: TavilySearch\n \
    \             - tool_configurations:\n                  exclude_domains: null\
    \      # 排除域名\n                  include_domains: null      # 包含域名\n    \
    \              include_answer: null       # 包含回答\n                  include_images:\
    \ null       # 包含图像\n                  include_raw_content: null  # 包含原始内容\n\
    \                  max_results: 3             # 最大结果数\n                  search_depth:\
    \ basic        # 搜索深度\n              - tool_label: TavilySearch\n            \
    \  - tool_name: tavily_search\n              - tool_parameters:\n            \
    \      query:\n                    type: mixed\n                    value: '{{#[输入节点ID].[变量名]#}}'\n\
    \n\n    usage_guide: |\n      工作流使用方法：\n      1. 开始节点\n         使用场景:\n\
    \         - 作为工作流的起始点\n         - 接受用户输入\n         - 将输入的信息保存为变量\n\
    \n\n         结构:\n         - id: 唯一ID（必填）\n         - type: start（固定）\n   \
    \      - variables: 输入变量的数组（必填）\n           - type: 变量的类型（必填）\n           - variable:\
    \ 变量名（必填）\n           - label: 显示标签（必填）\n           - required: 是否为必填输入（必填）\n\
    \           - 其他设置（根据类型所需）\n\n\n         变量类型与专有设置:\n         - file（文件输入）:\n\
    \           - allowed_file_types: 允许的文件类型\n             - document: 文档文件\n\
    \             - image: 图像文件\n             - audio: 音频文件\n             - video:\
    \ 视频文件\n           - allowed_file_upload_methods: 上传方式\n             - local_file:\
    \ 本地文件\n             - remote_url: 远程URL\n           - max_length: 最大文件名长度\n\
    \           - required: 是否为必填项\n         - number（数值输入）:\n           - min:\
    \ 最小值（可选）\n           - max: 最大值（可选）\n         - paragraph（段落文本）:\n  \
    \         - max_length: 最大字数（可选）\n           - options: 选项（可选）\n     \
    \    - text-input（短文本）:\n           - max_length: 最大字数（可选）\n          \
    \ - options: 选项（可选）\n\n\n      2. LLM节点\n         使用场景:\n         - 文本生成和响应创建\n\
    \         - 输入文本的加工和转换\n         - 生成问题的回答\n         结构:\n         - id: 唯一ID（必填）\n\
    \         - type: llm（固定）\n         - model:（必填）\n           - provider: openai（固定）\n\
    \           - name: gpt-5.4（固定）\n           - mode: chat（固定）\n           - completion_params:\n\
    \             - temperature: 0.0-1.0的值（必填）\n         - prompt_template:（必填）\n\
    \           - role: system（固定）\n           - text: 提示词文本（必填）\n         - context:（必填）\n\
    \           - enabled: true（固定）\n           - variable_selector: 指定要使用的变量（必填）\n\
    \         - vision:\n           - enabled: false（固定）\n         注意事项:\n       \
    \  - 提示词必须用单引号括住\n         - 只能使用系统角色的提示词\n         - 变量引用格式:\
    \ {{#节点ID.变量名#}}\n         \n      3. 结束节点\n         使用场景:\n         - 作为工作流的结束点\n\
    \         - 定义处理结果的输出\n         - 向后续系统传递数据\n\n\n         结构:\n       \
    \  - id: 唯一ID（必填）\n         - type: end（固定）\n         - outputs:（必填）\n    \
    \       - value_selector:（必填）\n             - [节点ID]\n             - [变量名]\n\
    \           - variable: 输出变量名（必填）\n\n\n         注意事项:\n         - 至少需要一个输出变量\n\
    \         - 可定义多个输出变量\n\n\n      4. HTTP请求节点\n         使用场景:\n      \
    \   - 与外部API联动\n         - 数据的发送和接收\n         - 发送Webhook通知\n         - 与外部服务集成\n\
    \n\n         结构:\n         - id: 唯一ID（必填）\n         - type: http-request（固定）\n\
    \         - data:（必填）\n           - authorization:（必填）\n             - config:\
    \ 认证设置（可选）\n             - type: 认证类型（必填）\n               - no-auth: 无认证\n\
    \               - basic: Basic认证\n               - bearer: Bearer认证\n        \
    \   - body:（必填）\n             - type: 请求体类型（必填）\n               - json:\
    \ JSON格式\n               - form-data: 多部分表单\n               - x-www-form-urlencoded:\
    \ URL编码格式\n             - data: 请求数据（必填）\n           - headers: 请求头信息（必填）\n\
    \           - method: HTTP方法（必填）\n           - url: 端点URL（必填）\n       \
    \    - timeout:（可选）\n             - max_connect_timeout: 连接超时秒数\n     \
    \        - max_read_timeout: 读取超时秒数\n             - max_write_timeout: 写入超时秒数\n\
    \           - title: 节点标题（必填）\n           - variables: 变量定义（可选）\n\n\n \
    \        注意事项:\n         HTTP方法:\n         - GET: 获取资源\n           - 通过查询参数进行搜索\n\
    \           - 可缓存\n         - POST: 发送/创建数据\n           - 资源的创建\n    \
    \       - 发送大量数据\n         - PUT: 更新/创建资源\n           - 完全替换\n      \
    \     - 具有幂等性\n         - PATCH: 部分更新资源\n           - 更新部分字段\n       \
    \    - 不具有幂等性\n         - DELETE: 删除资源\n           - 删除指定资源\n         -\
    \ HEAD: 获取请求头信息\n           - 无响应体\n\n\n         变量引用:\n         - 格式:\
    \ {{#[节点ID].[变量名]#}}\n         - 可引用其他节点的输出\n         - 可通过JSON路径引用嵌套的值\n\
    \n\n         超时设置:\n         - 0表示无限制\n         - 可以毫秒为单位指定\n       \
    \  - 可在各阶段单独设置\n\n\n      5. JSON Parse节点\n         使用场景:\n         - 解析JSON数据\n\
