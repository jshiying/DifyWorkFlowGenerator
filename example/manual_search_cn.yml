app:
  mode: workflow
  name: 手册问答系统
  version: 0.1.3

workflow:
  graph:
    edges:
      # 从开始到问题分类
      - source: '1731228343114'
        target: '1731228344221'
        data:
          sourceType: start
          targetType: question-classifier

      # Docker问题的情况
      - source: '1731228344221'
        sourceHandle: '1'
        target: '1731228345332'
        targetHandle: target
        data:
          sourceType: question-classifier
          targetType: knowledge-retrieval

      # Ubuntu问题的情况
      - source: '1731228344221'
        sourceHandle: '2'
        target: '1731228345333'
        targetHandle: target
        data:
          sourceType: question-classifier
          targetType: knowledge-retrieval

      # 从Docker知识获取到LLM
      - source: '1731228345332'
        target: '1731228346443'
        data:
          sourceType: knowledge-retrieval
          targetType: llm

      # 从Ubuntu知识获取到LLM
      - source: '1731228345333'
        target: '1731228346443'
        data:
          sourceType: knowledge-retrieval
          targetType: llm

      # 从LLM到结束
      - source: '1731228346443'
        target: '1731228347554'
        data:
          sourceType: llm
          targetType: end

      # 无法分类的问题直接到结束
      - source: '1731228344221'
        target: '1731228347554'
        data:
          sourceType: question-classifier
          targetType: end

    nodes:
      # 开始节点
      - id: '1731228343114'
        data:
          type: start
          title: 开始
          variables:
            - type: text-input
              variable: Query
              label: 请输入问题内容
              required: true
              max_length: 1000

      # 问题分类器节点
      - id: '1731228344221'
        data:
          type: question-classifier
          title: 问题分类
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.7
          query_variable_selector:
            - '1731228343114'
            - Query
          classes:
            - id: '1'
              name: Docker问题
            - id: '2'
              name: Ubuntu问题

      # Docker用知识获取节点
      - id: '1731228345332'
        data:
          type: knowledge-retrieval
          title: Docker知识获取
          dataset_ids:
            - 64862693-8529-4627-a20e-35b7dcb883c8
          retrieval_mode: multiple
          multiple_retrieval_config:
            reranking_enable: true
            reranking_mode: weighted_score
            top_k: 4
            weights:
              vector_setting:
                embedding_model_name: text-embedding-3-large
                embedding_provider_name: openai
                vector_weight: 1
              keyword_setting:
                keyword_weight: 0
          query_variable_selector:
            - '1731228343114'
            - Query

      # Ubuntu用知识获取节点
      - id: '1731228345333'
        data:
          type: knowledge-retrieval
          title: Ubuntu知识获取
          dataset_ids:
            - 84782981-6a4d-4d19-9189-dd72fe435a57
          retrieval_mode: multiple
          multiple_retrieval_config:
            reranking_enable: true
            reranking_mode: weighted_score
            top_k: 4
            weights:
              vector_setting:
                embedding_model_name: text-embedding-3-large
                embedding_provider_name: openai
                vector_weight: 1
              keyword_setting:
                keyword_weight: 0
          query_variable_selector:
            - '1731228343114'
            - Query

      # LLM节点
      - id: '1731228346443'
        data:
          type: llm
          title: 回答生成
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.7
          prompt_template:
            - role: system
              id: '1731228346443-1'
              text: '请参考以下上下文，针对用户的问题生成准确且易懂的回答。
回答请按以下格式创建：

1. 问题内容的摘要
2. 具体的回答
3. （根据需要）补充说明和注意事项

问题: {{#1731228343114.Query#}}'
          context:
            enabled: true
            variable_selector:
              - '1731228343114'
              - Query

      # 结束节点
      - id: '1731228347554'
        data:
          type: end
          title: 结束
          outputs:
            - value_selector:
                - '1731228343114'
                - Query
              variable: inputQuery
            - value_selector:
                - '1731228346443'
                - text
              variable: generatedAnswer
