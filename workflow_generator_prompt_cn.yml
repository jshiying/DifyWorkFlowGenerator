                  type: mixed（固定）
                  value: 搜索查询或变量引用

          注意事项:
          - 搜索查询:
            - 直接指定: '要搜索的关键词'
            - 变量引用: '{{#[输入节点ID].[变量名]#}}'
          
          - 搜索深度:
            - basic: 基础搜索（高速）
            - advanced: 详细搜索（更多结果）
          
          - 域名控制:
            - exclude_domains: 从搜索中排除的域名
            - include_domains: 搜索目标的域名
          
          - 结果控制:
            - max_results: 获取的搜索结果数量
            - include_answer: 获取相关回答
            - include_images: 获取相关图像
            - include_raw_content: 未加工内容
          - 与下一节点的连接:
            - 从搜索结果获取URL时，请使用参数提取节点

    output_format: |
      生成的YAML文件请遵循以下格式：
      ```yaml
      app:
        mode: workflow
        name: [工作流名称]
        version: 0.1.3

      workflow:
        graph:
          edges:
            # IF/ELSE分支的边示例
            - source: [IF/ELSE节点ID]
              target: [目标节点ID]
              data:
                sourceType: if-else
                targetType: [目标节点类型]
              sourceHandle: 'true'  # IF条件成立时
            - source: [IF/ELSE节点ID]
              target: [另一个目标节点ID]
              data:
                sourceType: if-else
                targetType: [目标节点类型]
              sourceHandle: 'false'  # ELSE条件时

          nodes:
            - id: [开始节点ID]
              data:
                type: start
                title: 开始
                variables:
                  # 文件输入的示例
                  - type: file
                    variable: input_document
                    label: 文档
                    required: true
                    max_length: 48
                    allowed_file_types:
                      - document
                    allowed_file_upload_methods:
                      - local_file
                      - remote_url

                  # 其他输入类型
                  - type: text-input
                    variable: [变量名]
                    type: string/number
                    label: [输入字段的标签]
                    required: true
                    max_length: [最大字数]

            - id: [LLM节点ID]
              data:
                type: llm
                title: LLM
                model:
                  provider: openai
                  name: gpt-5.4
                  mode: chat
                  completion_params:
                    temperature: 0.7
                prompt_template:
                  - id: [提示词ID]
                    role: system
                    text: '[提示词文本]'
                context:
                  enabled: true
                  variable_selector:
                    - [开始节点ID]
                    - [变量名]
                vision:
                  enabled: false
            - id: [结束节点ID]
              data:
                type: end
                title: 结束
                outputs:
                  - value_selector:
                      - [开始节点ID]
                      - [变量名]
                    variable: inputData
                  - value_selector:
                      - [LLM节点ID]
                      - text
                    variable: generatedText

            - id: [HTTP请求节点ID]
              data:
                type: http-request
                authorization:
                  config: null
                  type: no-auth  # 或所需的认证类型
                body:
                  type: json
                  data:
                    - id: [键值ID]
                      key: ''
                      type: text
                      value: |
                        {
                          "key1": "{{#[开始节点ID].[变量名]#}}",
                          "key2": "值2"
                        }
                headers: Content-Type:application/json
                method: post
                url: [API端点URL]
                timeout:
                  max_connect_timeout: 0
                  max_read_timeout: 0
                  max_write_timeout: 0
                title: HTTP请求
                variables: []

            - id: [JSON解析节点ID]
              data:
                type: tool
                desc: ''
                provider_id: json_process
                provider_name: json_process
                provider_type: builtin
                selected: false
                title: JSON Parse
                tool_configurations:
                  ensure_ascii: 1
                tool_label: JSON Parse
                tool_name: parse
                tool_parameters:
                  content:
                    type: mixed
                    value: '{{#[输入节点ID].[变量名]#}}'
                  json_filter:
                    type: mixed
                    value: [要提取的JSON键]

            - id: [问题分类器节点ID]
              data:
                type: question-classifier
                title: 问题分类器
                model:
                  provider: openai
                  name: gpt-5.4
                  mode: chat
                  completion_params:
                    temperature: 0.7
                query_variable_selector:
                  - [输入节点ID]
                  - [变量名]
                classes:
                  - id: '1'
                    name: [分类名1]
                  - id: '2'
                    name: [分类名2]

            - id: [知识获取节点ID]
              data:
                type: knowledge-retrieval
                title: 知识获取
                dataset_ids:
                  - [数据集ID]
                retrieval_mode: multiple
                multiple_retrieval_config:
                  reranking_enable: true
                  reranking_mode: weighted_score
                  top_k: 4
                  weights:
                    vector_setting:
                      embedding_model_name: text-embedding-3-large
                      embedding_provider_name: openai
                      vector_weight: 1
                    keyword_setting:
                      keyword_weight: 0
                query_variable_selector:
                  - [输入节点ID]
                  - [变量名]

            - id: [代码节点ID]
              data:
                type: code
                code_language: python3
                code: # Python程序的字符串
                outputs:  # 输出变量的定义（必填）
                  task_url:  # 变量名
                    children: null
                    type: string  # 指定上述定义的类型之一
                variables:  # 输入变量的定义（必填）
                  - value_selector:  # 来自其他节点的输入
                    - [输入节点ID]
                    - [变量名]
                    variable: arg1  # 函数的参数名

            - id: [IF/ELSE节点ID]
              data:
                type: if-else
                title: 条件分支
                cases:
                  - case_id: 'true'
                    logical_operator: and
                    conditions:
                      - id: [条件ID]
                        varType: [number/string/boolean]
                        variable_selector:
                          - [输入节点ID]
                          - [变量名]
                        comparison_operator: [比较运算符]
                        value: [比较值]
                        numberVarType: [constant/variable]  # 数值类型时
                      - id: [条件ID2]
                        varType: [变量类型]
                        key: [子变量键]  # 可选
                        comparison_operator: [比较运算符]
                        value: [比较值]
                        sub_variable_condition:  # 可选
                          case_id: [子条件ID]
                          logical_operator: and
                          conditions:
                            - id: [子条件ID]
                              varType: [变量类型]
                              comparison_operator: [比较运算符]
                              value: [比较值]

            - id: [变量聚合器节点]
              data:
                type: variable-aggregator
                title: 变量聚合器
                output_type: string  # 或 number/boolean
                variables:
                  - - [输入节点ID1]
                    - [变量名1]
                  - - [输入节点ID2]
                    - [变量名2]

            - id: [文档提取器节点ID]
              data:
                type: document-extractor
                title: 文本提取工具
                is_array_file: false
                variable_selector:
                  - [输入节点ID]
                  - [变量名]
            - id: [模板节点ID]
              data:
                type: template-transform
                title: 模板转换
                template: |
                  你好，{{ user_name }}！
                  你的得分是{{ score }}分。
                  {% if score >= 80 %}
                  合格！恭喜你。
                  {% else %}
                  很遗憾，不合格。
                  {% endif %}
                variables:
                  - value_selector:
                      - [输入节点ID]
                      - user_name
                    variable: user_name
                  - value_selector:
                      - [输入节点ID]
                      - score
                    variable: score
            - id: [响应节点ID]
              data:
                type: answer
                title: 响应输出
                answer: |
                  {{#[LLM节点ID].text#}}
                variables: []
            - id: [参数提取节点ID]
              data:
                type: parameter-extractor
                title: 参数提取
                query:
                  - [输入节点ID]
                  - [变量名]
                model:
                  provider: [提供商名称]
                  name: [模型名称]
                  mode: chat
                  completion_params:
                    temperature: 0.7
                reasoning_mode: prompt
                parameters:
                  - name: [参数名]
                    type: string/number/bool/select/array[string]/array[number]/array[object]
                    description: [说明文]
                    required: true/false
                    options: # 仅select类型时
                      - [选项1]
                      - [选项2]
                instruction: |
                  [提示词字符串]
                memory:
                  role_prefix:
                    user: [用户前缀]
                    assistant: [助手前缀]
                vision:
                  enabled: false
                  configs: {}
            - id: [YouTube字幕节点ID]
              data:
                type: tool
                title: Free YouTube Transcript API
                provider_name: transcript
                provider_id: transcript
                provider_type: builtin
                tool_label: Free YouTube Transcript API
                tool_name: free_youtube_transcript
                tool_configurations:
                  cookies: null
                  format: text
                  language: ja
                  preserve_formatting: 0
                  proxy: null
                tool_parameters:
                  video_id:
                    type: mixed
                    value: '{{#[输入节点ID].[变量名]#}}'
                outputs:
                  text:
                    type: string
            - id: [JinaReader节点ID]
              data:
                type: tool
                title: JinaReader
                provider_name: jina
                provider_id: jina
                provider_type: builtin
                tool_label: JinaReader
                tool_name: jina_reader
                tool_configurations:
                  gather_all_images_at_the_end: 0  # 图像收集设置
                  gather_all_links_at_the_end: 0   # 链接收集设置
                  image_caption: 0                 # 图像说明设置
                  no_cache: 0                      # 禁用缓存
                  proxy_server: null               # 代理服务器设置
                  summary: 0                       # 摘要功能
                  target_selector: null            # 目标元素选择器
                  wait_for_selector: null          # 等待元素选择器
                tool_parameters:
                  url:
                    type: mixed
                    value: '{{#[输入节点ID].[变量名]#}}'  # URL输入
                outputs:
                  text:
                    type: string
            - id: [TavilySearch节点ID]
              data:
                type: tool
                title: TavilySearch
                provider_name: tavily
                provider_id: tavily
                provider_type: builtin
                tool_label: TavilySearch
                tool_name: tavily_search
                tool_configurations:
                  exclude_domains: null      # 排除域名
                  include_domains: null      # 包含域名
                  include_answer: null       # 包含回答
                  include_images: null       # 包含图像
                  include_raw_content: null  # 包含原始内容
                  max_results: 3             # 最大结果数
                  search_depth: basic        # 搜索深度
                tool_parameters:
                  query:
                    type: mixed
                    value: '{{#[输入节点ID].[变量名]#}}'
                outputs:
                  text:
                    type: string
      ```
